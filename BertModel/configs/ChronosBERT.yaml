training_data_paths:
  - "/data/horse/ws/juha972b-BERT/Data/training_mix.arrow"
  - "/data/horse/ws/juha972b-BERT/Data/kernelsynth.arrow"
probability:
  - 0.9
  - 0.1

model_id: "prajjwal1/bert-small" 
model_type: mlm                
random_init: true             
tie_embeddings: false
mean_span_length: 3
masking_prob: 0.15     

tokenizer_class: "MeanScaleUniformBins"  
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0


n_tokens: 4096          
n_special_tokens: 4        
pad_token_id: 0
bos_token_id: 1
eos_token_id: 2
mask_token_id: 3           
use_eos_token: true

context_length: 512
min_past: 60

max_steps: 200000
save_steps: 1000
log_steps: 500
per_device_train_batch_size: 32

learning_rate: 1e-4

optim: adamw_torch_fused
gradient_accumulation_steps: 8
shuffle_buffer_length: 10000  
lr_scheduler_type: linear
warmup_ratio: 0.01            
dataloader_num_workers: 1
max_missing_prop: 0.9
num_samples: 20
temperature: 1.0
top_k: 50
top_p: 1.0


output_dir: /data/horse/ws/juha972b-AION-BERT-Chronos/BERTi/BertModel/BertSmall256
tf32: true
torch_compile: true


cache_dir: /tmp/hf-cache
trust_remote_code: false
model_revision: main
torch_dtype: float32
